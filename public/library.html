<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>myLibrary</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" href="./media/icons/logo.png">
</head>
<body>

<div id="container">
    <header>
        <div class="home-header-center left-side" style="display: flex; align-items: center; gap: 8px; margin-left: 65px;">
            <img class="logo" src="/media/icons/logo.svg" alt="logo">
            <h1 style="font-size: 42px;">myLibrary</h1>
        </div>
        <div class="right-side">
            <button id="logout">Logout</button>
            <button id="add-book">+ Add Book</button>
        </div>
    </header>
    <main>
        <div class="center">
            <div class="popup">
                <div class="close-btn">&times;</div>
                <form id="book-form" method="POST" novalidate>
                    <h2>Add a new book</h2>
                    <div class="form-element">
                        <label for="title">Title</label>
                        <input type="text" id="title" placeholder="Enter book title" maxlength="50" required>
                        <div class="error-message" id="title-error"></div>
                    </div>
                    <div class="form-element">
                        <label for="author">Author</label>
                        <input type="text" id="author" placeholder="Enter book author" maxlength="50" required>
                        <div class="error-message" id="author-error"></div>
                    </div>
                    <div class="form-element">
                        <label for="pages">Pages</label>
                        <input type="number" id="pages" placeholder="Enter number of pages" max="9999" required>
                        <div class="error-message" id="pages-error"></div>
                    </div>
                    <div class="form-element">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="" disabled selected>Select a category</option>
                            <option value="Biography">Biography</option>
                            <option value="Educational">Educational</option>
                            <option value="Fantasy">Fantasy</option>
                            <option value="Fiction">Fiction</option>
                            <option value="Horror">Horror</option>
                            <option value="Mystery">Mystery</option>
                            <option value="Religious">Religious</option>
                            <option value="Romance">Romance</option>
                            <option value="Sci-Fi">Sci-Fi</option>
                            <option value="Self-Improvement">Self-Improvement</option>
                            <option value="Other">Other</option>
                        </select>
                        <div class="error-message" id="category-error"></div>
                    </div>
                    <div class="form-element">
                        <input type="checkbox" id="read-check">
                        <label for="read-check">Finished reading</label>
                        <button type="submit" class="form-element">Add Book</button>
                    </div>
                </form>
            </div>
        </div>
        <div id="empty-library-message" style="display: none; text-align: center; margin-top: 10px; font-size: 26px;">
            <img src="/media/icons/cat.png" alt="No books yet" style="width: 475px; filter: grayscale(1)">
            <p>Add your first book to get started!</p>
        </div>
    </main>
    <footer>
        <p>Copyright © 2025 melovii & veryvroosh</p>
        <a href="https://github.com/Melovii/myLibrary" target="blank">
            <img class="github" src="media/icons/github.png" aria-hidden="true" alt="github logo"></img>
        </a>
    </footer>
</div>

</body>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const logoutBtn = document.getElementById('logout');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                window.location.href = '/logout';
            });
        }
    });
</script>
<script type="module" src="./js/main.js"></script>
</html>
